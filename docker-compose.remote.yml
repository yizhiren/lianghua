services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/lianghua.db
      TRAINING_SNAPSHOT_DIR: /app/data/training_snapshots
      BACKEND_LOG_PATH: /app/.runtime/backend.log
    volumes:
      - ./data:/app/data
      - ./.runtime:/app/.runtime
    ports:
      - "0.0.0.0:8010:8010"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://192.168.3.176:8010/api}
    ports:
      - "0.0.0.0:3001:3001"
    depends_on:
      - backend
    restart: unless-stopped

